{% extends "base.html" %}
{% block title %}生成中…{% endblock %}

{% block head %}
<style>
  .log-box {
    background: #0a0c14;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.85rem;
    line-height: 1.8;
    min-height: 200px;
    max-height: 400px;
    overflow-y: auto;
    color: #c8d0e0;
  }
  .log-line { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-done   { color: var(--success); }
  .status-error  { color: var(--danger); }
</style>
{% endblock %}

{% block content %}
<div class="steps">
  <div class="step done">① APIキー設定</div>
  <div class="step done">② トピック入力</div>
  <div class="step active">③ 記事生成</div>
</div>

<div class="card" id="progress-card">
  <div class="spinner" id="spinner"></div>
  <h2 style="text-align:center; margin-bottom:20px" id="status-title">記事を生成しています…</h2>

  <div class="log-box" id="log-box"></div>
</div>

<script>
  const jobId   = {{ job_id | tojson }};
  const logBox  = document.getElementById("log-box");
  const spinner = document.getElementById("spinner");
  const title   = document.getElementById("status-title");

  const es = new EventSource(`/stream/${jobId}`);

  es.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.msg) {
      const line = document.createElement("div");
      line.className = "log-line";
      line.textContent = data.msg;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    if (data.done) {
      es.close();
      spinner.style.display = "none";

      if (data.status === "done") {
        title.textContent    = "✅ 生成完了！";
        title.className      = "status-done";
        setTimeout(() => { location.href = `/results/${jobId}`; }, 800);
      } else {
        title.textContent = "❌ エラーが発生しました";
        title.className   = "status-error";
      }
    }
  };

  es.onerror = () => {
    es.close();
    spinner.style.display = "none";
    title.textContent = "接続が切断されました。ページをリロードしてください。";
    title.className   = "status-error";
  };
</script>
{% endblock %}
