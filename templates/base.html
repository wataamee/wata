<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}wata{% endblock %} — X 記事生成ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2e3244;
      --accent:  #6c63ff;
      --accent2: #00d4aa;
      --text:    #e8eaf0;
      --muted:   #8891a8;
      --danger:  #ff5c5c;
      --success: #00d4aa;
      --radius:  12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text);
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b85ff);
      color: #fff;
      width: 100%;
      justify-content: center;
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    /* Alert */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .alert-error  { background: rgba(255,92,92,.12); border: 1px solid rgba(255,92,92,.3); color: #ff8a8a; }
    .alert-success{ background: rgba(0,212,170,.12); border: 1px solid rgba(0,212,170,.3); color: var(--success); }

    /* Steps indicator */
    .steps {
      display: flex;
      gap: 0;
      margin-bottom: 32px;
    }
    .step {
      flex: 1;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    .step.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .step.done {
      color: var(--accent2);
      border-bottom-color: var(--accent2);
    }

    /* Misc */
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .muted { color: var(--muted); font-size: 0.85rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>wata</h1>
      <p>Xのツイートからトピックを抽出し、まとめ記事を自動生成</p>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
